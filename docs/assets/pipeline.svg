<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
  <rect width="900" height="300" fill="#f8fafc"/>
  <text x="24" y="34" font-size="18" font-weight="700" fill="#0f172a">One run: discover, score, digest</text>
  <text x="24" y="54" font-size="12" fill="#64748b">Everything left of the model calls is deterministic. A cancel check sits between stages.</text>
  <g font-size="12" text-anchor="middle">
    <rect x="24" y="90" width="140" height="70" rx="8" fill="#e0e7ff" stroke="#4f46e5"/>
    <text x="94" y="118" font-weight="700" fill="#1e1b4b">Discover</text><text x="94" y="138" fill="#3730a3">ATS boards, dedupe</text>
    <rect x="198" y="90" width="140" height="70" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="268" y="118" font-weight="700" fill="#14532d">Hard filters</text><text x="268" y="138" fill="#166534">pass · review · reject</text>
    <rect x="372" y="90" width="140" height="70" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="442" y="118" font-weight="700" fill="#14532d">Rank</text><text x="442" y="138" fill="#166534">embeddings, cap per company</text>
    <rect x="546" y="90" width="140" height="70" rx="8" fill="#fef3c7" stroke="#d97706"/>
    <text x="616" y="118" font-weight="700" fill="#78350f">Match (LLM)</text><text x="616" y="138" fill="#92400e">score + resume evidence</text>
    <rect x="720" y="90" width="156" height="70" rx="8" fill="#fce7f3" stroke="#db2777"/>
    <text x="798" y="118" font-weight="700" fill="#831843">Digest</text><text x="798" y="138" fill="#9d174d">ranked list, UI, Markdown</text>
  </g>
  <g stroke="#475569" stroke-width="2" marker-end="url(#a)"><path d="M164 125H196"/><path d="M338 125H370"/><path d="M512 125H544"/><path d="M686 125H718"/></g>
  <rect x="24" y="196" width="852" height="70" rx="8" fill="#e5e7eb" stroke="#4b5563"/>
  <text x="450" y="222" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle">SQLite store (per account)</text>
  <text x="450" y="242" font-size="12" fill="#374151" text-anchor="middle">jobs · scores · runs · decisions. Rescored only when content, rubric, model or preferences change.</text>
  <path d="M94 160V194M268 160V194M442 160V194M616 160V194M798 160V194" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
</svg>

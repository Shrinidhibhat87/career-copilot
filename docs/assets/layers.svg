<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
  <rect width="760" height="420" fill="#f8fafc"/>
  <text x="24" y="34" font-size="18" font-weight="700" fill="#0f172a">Layers and ports</text>
  <text x="24" y="54" font-size="12" fill="#64748b">Imports point inward. Use cases see ports, never adapters.</text>
  <rect x="24" y="72" width="712" height="52" rx="8" fill="#e0e7ff" stroke="#4f46e5"/>
  <text x="380" y="94" font-size="13" font-weight="700" fill="#1e1b4b" text-anchor="middle">Drivers</text>
  <text x="380" y="112" font-size="12" fill="#3730a3" text-anchor="middle">CLI (Typer) · FastAPI · Next.js UI</text>
  <path d="M380 124V146" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <rect x="24" y="148" width="712" height="52" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="380" y="170" font-size="13" font-weight="700" fill="#14532d" text-anchor="middle">Use cases + agents</text>
  <text x="380" y="188" font-size="12" fill="#166534" text-anchor="middle">discover · score · digest · pipeline.py (composition root)</text>
  <path d="M380 200V222" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <rect x="24" y="224" width="712" height="52" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="380" y="246" font-size="13" font-weight="700" fill="#78350f" text-anchor="middle">Ports (ports.py)</text>
  <text x="380" y="264" font-size="12" fill="#92400e" text-anchor="middle">JobSource · StateStore · LLMClient · Notifier</text>
  <path d="M380 276V298" stroke="#475569" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="392" y="292" font-size="11" fill="#64748b">implemented by</text>
  <rect x="24" y="300" width="712" height="52" rx="8" fill="#fce7f3" stroke="#db2777"/>
  <text x="380" y="322" font-size="13" font-weight="700" fill="#831843" text-anchor="middle">Adapters</text>
  <text x="380" y="340" font-size="12" fill="#9d174d" text-anchor="middle">ATS boards · SQLite · LiteLLM behind the PII redactor · Markdown digest</text>
  <rect x="24" y="366" width="712" height="34" rx="8" fill="#e5e7eb" stroke="#4b5563"/>
  <text x="380" y="388" font-size="12" fill="#1f2937" text-anchor="middle">Domain: pure functions and dataclasses, stdlib only. Every layer above may import it.</text>

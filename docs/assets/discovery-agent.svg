    <text x="119" y="202" fill="#3730a3">pydantic-ai loop</text>
    <text x="119" y="220" fill="#3730a3">discovery model role</text>
    <rect x="330" y="76" width="200" height="40" rx="8" fill="#dcfce7" stroke="#16a34a"/><text x="430" y="101" fill="#14532d">web_search</text>
    <rect x="330" y="126" width="200" height="40" rx="8" fill="#dcfce7" stroke="#16a34a"/><text x="430" y="151" fill="#14532d">known_companies</text>
    <rect x="330" y="176" width="200" height="40" rx="8" fill="#dcfce7" stroke="#16a34a"/><text x="430" y="201" fill="#14532d">probe_ats</text>
    <rect x="330" y="226" width="200" height="40" rx="8" fill="#dcfce7" stroke="#16a34a"/><text x="430" y="251" fill="#14532d">sample_jobs</text>
    <rect x="330" y="276" width="200" height="40" rx="8" fill="#fef3c7" stroke="#d97706"/><text x="430" y="301" fill="#78350f">propose_source</text>
    <rect x="620" y="270" width="176" height="52" rx="8" fill="#e5e7eb" stroke="#4b5563"/>
    <text x="708" y="293" font-weight="700" fill="#1f2937">source_proposals</text><text x="708" y="310" fill="#374151">you approve in the UI</text>

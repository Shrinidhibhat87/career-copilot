<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="820" height="400" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
  <rect width="820" height="400" fill="#f8fafc"/>
  <text x="24" y="34" font-size="18" font-weight="700" fill="#0f172a">Discovery agent: tool-calling loop</text>
  <text x="24" y="54" font-size="12" fill="#64748b">The model picks tools; plain Python rules inside each tool say what is allowed.</text>
  <g font-size="12" text-anchor="middle">

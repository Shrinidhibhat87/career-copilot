  <g stroke="#475569" stroke-width="2" marker-end="url(#a)"><path d="M214 190H328"/><path d="M530 296H618"/></g>
  <path d="M214 215H328" stroke="#475569" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="271" y="236" font-size="11" fill="#64748b" text-anchor="middle">results</text>
  <rect x="24" y="346" width="772" height="40" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="410" y="371" font-size="12" fill="#7f1d1d" text-anchor="middle">Limits: max requests, max tool calls, search cap, euro budget (discovery: in config). A "refused" answer is a rule, not a retry hint.</text>

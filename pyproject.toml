[project]
name = "career-copilot"
version = "0.1.0"
description = "Personal job-search agent: finds well-matched roles and returns an application strategy."
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "litellm>=1.44",
    "python-dotenv>=1.0",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "python-multipart>=0.0.32",
    "pypdf>=6.16.2",
    "presidio-analyzer>=2.2.364",
    "spacy>=3.8.16",
    "pydantic-ai-slim[openai]>=1.0",
    "fastembed>=0.9.0",
    "keyring>=25",
]

[project.scripts]
career-copilot = "career_copilot.__main__:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/career_copilot"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Specs and plans embed Python snippets that are illustrative, not source.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not calibration'"
markers = [
    "calibration: needs a live model and a labeled set; run with -m calibration",
    "real_auth: runs the real sign-in gate instead of the signed-in test default",
]
